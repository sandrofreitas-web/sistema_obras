<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer glow circle -->
  <circle cx="256" cy="256" r="180" fill="#f59e0b" opacity="0.05" />

  <!-- HardHat Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 250)">
    <!-- Helmet Dome -->
    <path d="M -140,20 C -140,-80 -80,-140 0,-140 C 80,-140 140,-80 140,20 Z" fill="url(#amberGrad)" />
    <!-- Helmet Ridge -->
    <path d="M -30,-140 C -15,-155 15,-155 30,-140 L 25,-10 L -25,-10 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Helmet Brim -->
    <rect x="-170" y="15" width="340" height="34" rx="17" fill="url(#goldGrad)" />
    <!-- Architectural Grid Lines (Ruler / Blueprint Accent) -->
    <g stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.4">
      <line x1="-100" y1="26" x2="-100" y2="38" />
      <line x1="-60" y1="26" x2="-60" y2="38" />
      <line x1="-20" y1="26" x2="-20" y2="38" />
      <line x1="20" y1="26" x2="20" y2="38" />
      <line x1="60" y1="26" x2="60" y2="38" />
      <line x1="100" y1="26" x2="100" y2="38" />
    </g>
    <!-- Modern Construction Brick / Wall Accent below -->
    <g transform="translate(0, 80)">
      <rect x="-90" y="0" width="80" height="24" rx="6" fill="#334155" />
      <rect x="10" y="0" width="80" height="24" rx="6" fill="#334155" />
      <rect x="-45" y="30" width="90" height="24" rx="6" fill="#f59e0b" opacity="0.9" />
    </g>
  </g>
</svg>
